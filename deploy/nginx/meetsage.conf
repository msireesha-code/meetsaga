# Example nginx reverse proxy for MeetSage running in production mode
# (single backend process on 127.0.0.1:8000 serving both API and the built
# frontend — see deploy/systemd/meetsage.service). Terminates TLS here rather
# than in the app itself.
#
# Install: copy to /etc/nginx/sites-available/meetsage.conf, symlink into
# sites-enabled/, adjust server_name and certificate paths, then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name meetsage.example.internal;

    # Redirect everything to HTTPS once you have a real certificate configured.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meetsage.example.internal;

    ssl_certificate     /etc/ssl/certs/meetsage.crt;
    ssl_certificate_key /etc/ssl/private/meetsage.key;

    # Meeting recordings can be large; match MAX_UPLOAD_SIZE_MB from .env.
    client_max_body_size 2048m;

    # Transcription/diarization can legitimately take a long time on CPU-only
    # hardware — keep proxy timeouts generous rather than cutting off a
    # slow-but-working request (see docs/troubleshooting.md).
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
